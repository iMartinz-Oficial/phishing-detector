<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing Detector</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #00d4ff; font-size: 2.5rem; margin-bottom: 10px; }
        .header p { color: #a0a0a0; }
        .card { background: #1e1e2e; border-radius: 16px; padding: 30px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #00d4ff; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; background: #2a2a3e; border: 1px solid #3a3a4e; border-radius: 8px; color: #fff; font-size: 14px; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #00d4ff; }
        .form-group textarea { height: 120px; resize: vertical; }
        button { width: 100%; padding: 15px; background: linear-gradient(135deg, #00d4ff, #0099cc); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: scale(1.02); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #result { display: none; }
        .result-header { text-align: center; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .result-header.phishing { background: linear-gradient(135deg, #ff4444, #cc0000); }
        .result-header.suspicious { background: linear-gradient(135deg, #ffaa00, #ff6600); }
        .result-header.legitimate { background: linear-gradient(135deg, #00cc66, #009944); }
        .result-header h2 { color: #fff; font-size: 1.8rem; }
        .score-bar { background: #3a3a4e; border-radius: 8px; height: 24px; margin: 15px 0; overflow: hidden; }
        .score-fill { height: 100%; border-radius: 8px; transition: width 0.5s; }
        .score-fill.phishing { background: linear-gradient(90deg, #ff4444, #ff0000); }
        .score-fill.suspicious { background: linear-gradient(90deg, #ffaa00, #ff6600); }
        .score-fill.legitimate { background: linear-gradient(90deg, #00cc66, #009944); }
        .details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .detail-item { background: #2a2a3e; padding: 15px; border-radius: 8px; }
        .detail-item h4 { color: #00d4ff; margin-bottom: 8px; }
        .detail-item p { color: #a0a0a0; font-size: 14px; }
        .recommendation { background: #2a2a3e; padding: 20px; border-radius: 12px; margin-top: 20px; }
        .recommendation h3 { color: #00d4ff; margin-bottom: 10px; }
        .recommendation p { color: #fff; }
        .loader { display: none; text-align: center; padding: 20px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #3a3a4e; border-top: 4px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Phishing Detector</h1>
            <p>Detector de Phishing con Machine Learning</p>
        </div>
        
        <div class="card">
            <div class="form-group">
                <label>📧 Remitente (from)</label>
                <input type="text" id="sender" placeholder="support@company.com">
            </div>
            <div class="form-group">
                <label>📝 Asunto</label>
                <input type="text" id="subject" placeholder="URGENT: Account Security Alert">
            </div>
            <div class="form-group">
                <label>📄 Contenido del email</label>
                <textarea id="content" placeholder="Dear customer, your account requires verification..."></textarea>
            </div>
            <button onclick="analyze()" id="analyzeBtn">🔍 Analizar Email</button>
        </div>
        
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p style="color: #a0a0a0; margin-top: 10px;">Analizando email...</p>
        </div>
        
        <div id="result">
            <div class="card">
                <div class="result-header" id="resultHeader">
                    <h2 id="resultLabel">Resultado</h2>
                </div>
                <p style="text-align: center; color: #a0a0a0;">Nivel de riesgo: <span id="scoreValue">0</span>%</p>
                <div class="score-bar">
                    <div class="score-fill" id="scoreFill" style="width: 0%"></div>
                </div>
                <div class="details">
                    <div class="detail-item">
                        <h4>📧 Remitente</h4>
                        <p id="senderDetail">-</p>
                    </div>
                    <div class="detail-item">
                        <h4>📝 Asunto</h4>
                        <p id="subjectDetail">-</p>
                    </div>
                    <div class="detail-item">
                        <h4>📄 Contenido</h4>
                        <p id="contentDetail">-</p>
                    </div>
                </div>
                <div class="recommendation">
                    <h3>💡 Recomendación</h3>
                    <p id="recommendation">-</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        async function analyze() {
            const sender = document.getElementById('sender').value;
            const subject = document.getElementById('subject').value;
            const content = document.getElementById('content').value;
            
            if (!content) {
                alert('Por favor ingrese el contenido del email');
                return;
            }
            
            document.getElementById('analyzeBtn').disabled = true;
            document.getElementById('loader').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            
            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender, subject, content })
                });
                const data = await response.json();
                
                document.getElementById('scoreValue').textContent = data.score;
                document.getElementById('resultLabel').textContent = data.label.toUpperCase();
                document.getElementById('senderDetail').textContent = data.details.sender.message;
                document.getElementById('subjectDetail').textContent = data.details.subject.message;
                document.getElementById('contentDetail').textContent = data.details.content.message;
                document.getElementById('recommendation').textContent = data.recommendation;
                
                const header = document.getElementById('resultHeader');
                const fill = document.getElementById('scoreFill');
                header.className = 'result-header ' + data.label;
                fill.className = 'score-fill ' + data.label;
                fill.style.width = data.score + '%';
                
                document.getElementById('result').style.display = 'block';
            } catch (error) {
                alert('Error al analizar: ' + error.message);
            }
            
            document.getElementById('analyzeBtn').disabled = false;
            document.getElementById('loader').style.display = 'none';
        }
    </script>
</body>
</html>
